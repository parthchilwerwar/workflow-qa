name: QA Automation

# Run on pushes/PRs to main, on a nightly schedule, and on manual dispatch.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * *"   # 02:00 UTC nightly regression
  workflow_dispatch: {}    # allow manual runs from the Actions tab

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: static checks + collection. Needs NO application credentials, so it
  # always runs and gives fast, deterministic feedback on every push/PR.
  # ---------------------------------------------------------------------------
  static-checks:
    name: Lint, format & collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Byte-compile all sources
        run: python -m compileall config api pages fixtures tests conftest.py data_factory.py

      - name: Validate test collection (no browser, no secrets)
        run: pytest --collect-only -q

  # ---------------------------------------------------------------------------
  # Job 2: test execution. Environment-dependent tests read secrets from GitHub
  # Actions. When secrets are absent the suite SKIPS cleanly (WorkFlow Pro is
  # fictional), so this job never fails merely for lack of credentials.
  # ---------------------------------------------------------------------------
  tests:
    name: Playwright + Pytest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: static-checks

    env:
      # --- Application under test (injected as repo/organisation secrets) ---
      BASE_URL: ${{ secrets.BASE_URL }}
      API_BASE_URL: ${{ secrets.API_BASE_URL }}
      TEST_ENV: ci
      # --- Company 1 (primary tenant) ---
      COMPANY1_USERNAME: ${{ secrets.COMPANY1_USERNAME }}
      COMPANY1_PASSWORD: ${{ secrets.COMPANY1_PASSWORD }}
      COMPANY1_API_TOKEN: ${{ secrets.COMPANY1_API_TOKEN }}
      TEST_OTP: ${{ secrets.TEST_OTP }}
      # --- Company 2 (isolation tests) ---
      COMPANY2_USERNAME: ${{ secrets.COMPANY2_USERNAME }}
      COMPANY2_PASSWORD: ${{ secrets.COMPANY2_PASSWORD }}
      COMPANY2_API_TOKEN: ${{ secrets.COMPANY2_API_TOKEN }}
      # --- BrowserStack (optional) ---
      USE_BROWSERSTACK: ${{ secrets.USE_BROWSERSTACK }}
      BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
      # --- Runtime ---
      HEADLESS: "true"
      BROWSER: chromium

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      # -n auto     : parallelise across CPUs
      # --reruns 1  : retry a flaky test once before marking it failed
      # JUnit + HTML: machine- and human-readable reports for artifacts
      - name: Run pytest
        run: |
          pytest \
            -n auto \
            --reruns 1 \
            --junitxml=reports/junit.xml \
            --html=reports/report.html \
            --self-contained-html

      - name: Upload test reports & failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qa-reports
          path: |
            reports/
            screenshots/
            traces/
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish test summary
        if: ${{ always() }}
        uses: mikepenz/action-junit-report@v4
        with:
          report_paths: reports/junit.xml
          fail_on_failure: false
