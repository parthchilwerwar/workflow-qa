[pytest]
# ---------------------------------------------------------------------------
# Pytest configuration for the WorkFlow Pro automation framework.
# ---------------------------------------------------------------------------

# Where tests live and how they are discovered.
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# conftest / fixtures are exposed from the fixtures package.
# (fixtures/conftest.py is auto-collected because it sits under the rootdir.)

# Default command-line options applied to every run.
#   -ra                : show extra summary for all except passed
#   --strict-markers   : fail on unknown markers (prevents typos)
#   --tb=short         : concise tracebacks
#   --html report      : self-contained HTML report for CI artifacts
addopts =
    -ra
    --strict-markers
    --tb=short
    --html=reports/report.html
    --self-contained-html

# Custom markers keep suites selectable, e.g. `pytest -m smoke`.
markers =
    smoke: fast, critical-path checks run on every commit
    regression: broader coverage run on schedule / pre-release
    login: authentication and session tests
    tenant: tenant-isolation and RBAC tests
    integration: end-to-end API + UI flows
    mobile: responsive / mobile-viewport tests
    api: pure API-layer tests (no browser)
    unit: pure-logic unit tests (no browser, no network)

# Logging: emit readable logs during a run (helpful in CI).
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-8s | %(name)s | %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
